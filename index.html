<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المجالس واللطميات</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Roboto','Segoe UI', Tahoma, sans-serif; }
  body { background:#0f0f0f; color:#fff; padding-bottom:40px; }

  /* الهيدر */
  .header-banner {
    width:100%; height:160px;
    background-image:url('https://raw.githubusercontent.com/h-80/img/refs/heads/main/alarajiweb2.png');
    background-size:cover; background-position:center;
    border-radius:0 0 12px 12px;
  }

  /* البروفايل */
  .profile-section { display:flex; align-items:center; gap:16px; padding:16px; }
  .profile-pic {
    width:80px; height:80px; border-radius:50%;
    object-fit:cover; border:3px solid #0f0f0f; flex-shrink:0;
  }
  .profile-info h1 { font-size:22px; font-weight:700; margin-bottom:6px; }
  .profile-info .desc { font-size:13px; color:#aaa; font-weight:400; line-height:1.5; }

  /* شريط الأقسام */
  .tabs-bar {
    display:flex; gap:24px; padding:12px 16px;
    border-bottom:1px solid #272727; overflow-x:auto; scrollbar-width:none;
  }
  .tabs-bar::-webkit-scrollbar { display:none; }
  .tab {
    font-size:15px;
    font-weight:700;
    color:#fff;
    text-decoration:none;
    white-space:nowrap;
    padding-bottom:6px;
    transition:0.2s;
  }
  .tab:hover { opacity:0.7; }

  /* المشغل */
  .player-wrapper { width:100%; aspect-ratio:16/9; background:#000; }
  .player-wrapper iframe { width:100%; height:100%; border:none; }

  /* الكروت */
  .cards-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:20px; padding:20px 16px;
  }
  .card { cursor:pointer; transition:transform 0.2s; }
  .card:hover { transform:translateY(-3px); }
  .card-thumb {
    position:relative; width:100%; aspect-ratio:16/9;
    border-radius:12px; overflow:hidden; background:#222;
  }
  .card-thumb img { width:100%; height:100%; object-fit:cover; }
  .card-title {
    font-size:14px; font-weight:500; margin-top:10px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* ===== التذييل ===== */
  .footer {
    margin-top:30px; padding:14px 16px;
    border-top:1px solid #272727;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .social-icons {
    display:flex; justify-content:center; flex-wrap:wrap; gap:14px;
  }
  .social-icons a {
    width:42px; height:42px; border-radius:50%;
    background:#1f1f1f;
    display:flex; align-items:center; justify-content:center;
    color:#fff; transition:0.2s; text-decoration:none; font-size:18px;
  }
  .social-icons a:hover { background:#333; transform:translateY(-3px); }
  .footer-copy { font-size:11px; color:#666; }

  @media (max-width:600px) {
    .cards-grid { grid-template-columns:repeat(2,1fr); gap:12px; padding:16px 10px; }
    .card-title { font-size:12px; }
    .profile-pic { width:65px; height:65px; }
    .profile-info h1 { font-size:18px; }
    .header-banner { height:120px; }
    .social-icons a { width:38px; height:38px; font-size:16px; }
  }
</style>
</head>
<body>

  <div class="header-banner"></div>

  <div class="profile-section">
    <img class="profile-pic" src="https://raw.githubusercontent.com/h-80/img/refs/heads/main/alarajiweb1.jpg" alt="حيدر الأعرجي">
    <div class="profile-info">
      <h1>حيدر الأعرجي</h1>
      <p class="desc">الموقع الرسمي للرادود حيدر الأعرجي</p>
    </div>
  </div>

  <div class="tabs-bar" id="tabsBar"></div>

  <div class="player-wrapper">
    <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay"></iframe>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

  <footer class="footer">
    <div class="social-icons" id="socialIcons"></div>
    <p class="footer-copy">© 2025 حيدر الأعرجي - جميع الحقوق محفوظة</p>
  </footer>

<script>
const tabsData = `
الصفحة الرئيسية
https://hr-80.github.io/haiaderalaraji.com
اللطميات والمجالس
https://hr-80.github.io/video1/

Shorts
https://hr-80.github.io/video3/
التواصل الأجتماعي
https://hr-80.github.io/haiaderalaraji/
`;

const videosData = `
محرم يامحرم
https://www.youtube.com/watch?v=ZisrP8trNyI
محرم يامحرم - قناة الأوحد
https://www.youtube.com/watch?v=gxT71HOdD-s

اليوم ازلزلها الطفوف
https://www.youtube.com/watch?v=-7tpOMk-T8c
انا العباس
https://www.youtube.com/watch?v=w_C8--IlUqE

https://www.youtube.com/watch?v=4nMeTyGMWTQ

https://www.youtube.com/watch?v=vZkYPM6jMR4&pp=0gcJCT4LAYcqIYzv

`;

const socialData = `
facebook
https://www.facebook.com/hr.alaraji1
instagram
https://www.instagram.com/hr.alaraji
youtube
https://www.youtube.com/@hr.alaraji
tiktok
https://www.tiktok.com/@hr.alaraji
store
https://sites.google.com/view/haider-alaraji/home/application?pli=1&authuser=0
link
https://hr-80.github.io/haiaderalaraji.com
`;

const socialIcons = {
  facebook:  'fa-brands fa-facebook-f',
  instagram: 'fa-brands fa-instagram',
  youtube:   'fa-brands fa-youtube',
  tiktok:    'fa-brands fa-tiktok',
  store:     'fa-brands fa-google-play',
  link:      'fa-solid fa-link'
};

function getVideoId(url) {
  if (!url) return null;
  url = url.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  const patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /\/embed\/([a-zA-Z0-9_-]{11})/,
    /\/shorts\/([a-zA-Z0-9_-]{11})/,
    /\/live\/([a-zA-Z0-9_-]{11})/,
    /\/v\/([a-zA-Z0-9_-]{11})/
  ];
  for (let p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

function buildTabs() {
  const bar = document.getElementById('tabsBar');
  const lines = tabsData.trim().split('\n').map(l=>l.trim()).filter(l=>l);
  bar.innerHTML = '';
  for (let i=0; i<lines.length; i+=2) {
    const a = document.createElement('a');
    a.className = 'tab';
    a.href = lines[i+1] || '#';
    a.textContent = lines[i];
    bar.appendChild(a);
  }
}

function buildCards() {
  const grid = document.getElementById('cardsGrid');
  const lines = videosData.trim().split('\n').map(l=>l.trim()).filter(l=>l);
  grid.innerHTML = '';
  for (let i=0; i<lines.length; i+=2) {
    const title = lines[i];
    const vid = getVideoId(lines[i+1] || '');
    if (!vid) continue;
    const thumb = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-thumb"><img src="${thumb}" alt="${title}" loading="lazy"></div>
      <div class="card-title">${title}</div>
    `;
    card.addEventListener('click', () => playVideo(vid));
    grid.appendChild(card);
  }
}

function playVideo(vid) {
  const player = document.getElementById('mainPlayer');
  player.src = `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0`;
  player.scrollIntoView({ behavior:'smooth', block:'start' });
}

function loadFirstVideo() {
  const lines = videosData.trim().split('\n').map(l=>l.trim()).filter(l=>l);
  if (lines.length >= 2) {
    const vid = getVideoId(lines[1]);
    if (vid) document.getElementById('mainPlayer').src =
      `https://www.youtube.com/embed/${vid}?rel=0`;
  }
}

function buildSocial() {
  const box = document.getElementById('socialIcons');
  const lines = socialData.trim().split('\n').map(l=>l.trim()).filter(l=>l);
  box.innerHTML = '';
  for (let i=0; i<lines.length; i+=2) {
    const key = lines[i].toLowerCase();
    const url = lines[i+1] || '#';
    const icon = socialIcons[key];
    if (!icon) continue;
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', key);
    a.innerHTML = `<i class="${icon}"></i>`;
    box.appendChild(a);
  }
}

buildTabs();
buildCards();
buildSocial();
loadFirstVideo();
</script>

</body>
</html>
